<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=example_opensky_flight_density_map.html">
  <title>OpenSky Flight Density Map</title>
  <script>
    window.location.replace("example_opensky_flight_density_map.html");
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 10px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 20px;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 16px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      transition: all 0.2s;
    }
    a:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Loading OpenSky Flight Density Map...</h2>
  <p>If you are not redirected automatically within a few seconds:</p>
  <a href="example_opensky_flight_density_map.html">Open Map Directly</a>
</body>
</html>
